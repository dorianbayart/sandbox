<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <style>html{background:#0d1117}</style>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/pixelbasel" />
  <link rel="stylesheet" href="{{ '/assets/css/sandbox.css' | relative_url }}" />
</head>
<body>
  <main class="{{ page.layout | default: 'page' }}">
    {{ content }}
  </main>

  <footer>
    <a href="https://github.com/dorianbayart/sandbox">Source on GitHub</a>
    <span>·</span>
    <a href="https://0xdba.dev">0xdba.dev</a>
  </footer>
</body>
</html>
